name: PHP foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/smoke.php
      - run: php tests/behavior.php
      - run: php tools/build.php
      - run: for mode in admin frontend disabled modules-disabled old-wp multisite; do php tests/loader.php "$mode" || exit 1; done

name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Verify tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: php tools/build.php "$RELEASE_TAG"
      - run: php tools/package.php
      - run: php tests/package.php
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS.txt
            docs/release-notes.md
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle
      - name: Create draft only; never overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" bundle/dist/*.zip bundle/dist/manifest.json bundle/dist/SHA256SUMS.txt --verify-tag --draft --title "JT WP Care $RELEASE_TAG" --notes-file bundle/docs/release-notes.md "${flags[@]}"
